# `docker compose up -d` starts only the infrastructure (database and mail catcher) for local
# development. `docker compose --profile app up --build` also builds and runs the API and the web.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: book_exchange
      POSTGRES_PASSWORD: book_exchange
      POSTGRES_DB: book_exchange
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U book_exchange']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://book_exchange:book_exchange@postgres:5432/book_exchange?schema=public
      JWT_SECRET: change-me-to-a-long-random-string
      JWT_EXPIRES_IN: 7d
      WEB_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      PORT: 4000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Book Exchange <no-reply@book-exchange.local>
    ports:
      - '4000:4000'
    volumes:
      - uploads-data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  uploads-data:
